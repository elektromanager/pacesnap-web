<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PaceSnap Workout</title>
<meta property="og:title" content="PaceSnap Workout">
<meta property="og:description" content="Ein Intervall-Workout für PaceSnap · An interval workout for PaceSnap">
<link rel="stylesheet" href="../site.css">
</head>
<body>
<main>
  <header>
    <a class="brand" href="../">PaceSnap</a>
    <nav class="lang" aria-label="Sprache / Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </nav>
  </header>
  <h1 id="title">Workout</h1>
  <div class="card" id="details" hidden>
    <div class="grid">
      <div class="stat work"><div class="v" id="work"></div><div class="l" data-t="work"></div></div>
      <div class="stat rest"><div class="v" id="rest"></div><div class="l" data-t="rest"></div></div>
      <div class="stat"><div class="v" id="sets"></div><div class="l" data-t="sets"></div></div>
      <div class="stat"><div class="v" id="total"></div><div class="l" data-t="total"></div></div>
    </div>
    <div class="extra" id="extra"></div>
  </div>
  <p class="muted" id="error" hidden data-t="invalid"></p>
  <a class="btn primary" id="open" href="#" data-t="open"></a>
  <a class="btn secondary" id="store" data-t="install"></a>
  <p class="hint" data-t="hint"></p>
  <footer class="legal-links">
    <a data-href-de="https://systemwolf-dev.de/impressum.html" data-href-en="https://systemwolf-dev.de/imprint.html" data-t="imprint"></a>
    ·
    <a data-href-de="https://systemwolf-dev.de/datenschutz.html" data-href-en="https://systemwolf-dev.de/privacy.html" data-t="privacy"></a>
  </footer>
</main>
<script src="../i18n.js"></script>
<script>
  const PACKAGE = 'com.pacesnap.pacesnap';
  const STORE = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
  const T = {
    de: {
      imprint: 'Impressum', privacy: 'Datenschutz',
      work: 'Belastung', rest: 'Pause', sets: 'Sätze', total: 'Dauer',
      rounds: n => n + ' Runden', exercises: 'Übungen', coach: 'Coach',
      open: 'IN PACESNAP ÖFFNEN', install: 'PaceSnap installieren',
      hint: 'Kostenlos für Android. Das Workout wird beim Öffnen in die App übernommen.',
      invalid: 'Dieser Link enthält kein gültiges Workout. Frag nach einem neuen Link.',
    },
    en: {
      imprint: 'Imprint', privacy: 'Privacy',
      work: 'Work', rest: 'Rest', sets: 'Sets', total: 'Duration',
      rounds: n => n + ' rounds', exercises: 'Exercises', coach: 'Coach',
      open: 'OPEN IN PACESNAP', install: 'Get PaceSnap',
      hint: 'Free for Android. Opening the link adds the workout to the app.',
      invalid: "This link doesn't contain a valid workout. Ask for a new link.",
    },
  };

  const data = location.hash.slice(1);
  const $ = id => document.getElementById(id);
  $('store').href = STORE;
  // Opens the app via its pacesnap:// filter; without the app, Android
  // falls back to the Play Store.
  $('open').href = 'intent://import?d=' + data + '#Intent;scheme=pacesnap;package=' +
    PACKAGE + ';S.browser_fallback_url=' + encodeURIComponent(STORE) + ';end';
  if (!/android/i.test(navigator.userAgent)) $('open').hidden = true;

  // Same format as PresetShare in the app: base64url → raw deflate → JSON.
  async function decode(s) {
    const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(stream).text());
  }
  const sec = n => n >= 60 ? Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0') + ' min' : n + ' s';

  let workout = null;
  function render(t) {
    if (!workout) return;
    const w = workout;
    const sets = w.s || 1, cycles = w.c || 1, work = w.w || 0, rest = w.r || 0;
    const total = (w.p || 0) + cycles * (sets * work + (sets - 1) * rest)
      + (cycles - 1) * (w.rc || 0) + (w.cd || 0);
    $('title').textContent = w.t || 'Workout';
    document.title = (w.t || 'Workout') + ' · PaceSnap';
    $('work').textContent = work + ' s';
    $('rest').textContent = rest + ' s';
    $('sets').textContent = cycles > 1 ? sets + ' × ' + cycles : sets;
    $('total').textContent = sec(total);
    const extra = [];
    if (cycles > 1) extra.push(t.rounds(cycles));
    if (w.x && w.x.length) extra.push(t.exercises + ': ' + [...new Set(w.x)].join(', '));
    if (w.co) extra.push(t.coach + ': ' + w.co.charAt(0).toUpperCase() + w.co.slice(1));
    $('extra').textContent = extra.join(' · ');
    $('details').hidden = false;
  }

  initI18n(T, render);
  decode(data).then(w => {
    if (w.v !== 1) throw new Error('version');
    workout = w;
    render(T[currentLang()]);
  }).catch(() => {
    $('error').hidden = false;
    $('open').hidden = true;
  });
</script>
</body>
</html>
